<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blueprint Editor</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7fb; margin: 0; color: #1f2937; }
    .page { max-width: 1400px; margin: 24px auto; padding: 0 24px 32px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .panel { background: white; border: 1px solid #dfe7f5; border-radius: 14px; box-shadow: 0 8px 20px rgba(17, 24, 39, 0.06); }
    .layout { display: grid; grid-template-columns: 360px 1fr; gap: 18px; }
    .controls { padding: 18px; }
    .canvas-wrap { padding: 18px; }
    .field { display: grid; gap: 6px; margin-bottom: 12px; }
    label { font-size: 12px; font-weight: 700; color: #475569; }
    select, input, button { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #d1d9e6; font-size: 14px; }
    button { background: #1d4ed8; color: white; border: none; font-weight: 700; cursor: pointer; }
    .btn-secondary { background: #e2e8f0; color: #0f172a; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .stat { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; }
    .canvas-area { position: relative; overflow: auto; border: 1px solid #dbe3f0; border-radius: 12px; background: repeating-linear-gradient(45deg, #fff, #fff 10px, #f8fafc 10px, #f8fafc 20px); }
    canvas { display: block; background: white; }
    .legend { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .status { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #ecfdf5; color: #166534; font-size: 12px; display: none; }
    .status.error { background: #fff1f2; color: #9f1239; }
    .status.show { display: block; }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1 style="margin:0;">Blueprint Editor</h1>
        <p style="margin:6px 0 0; color:#64748b;">Associate a camera with a store plan and calibrate movement to the blueprint.</p>
      </div>
      <a href="/admin/dashboard" style="text-decoration:none; color:#1d4ed8; font-weight:700;">Back to Dashboard</a>
    </div>

    <div class="layout">
      <aside class="panel controls">
        <div class="field">
          <label for="storeSelect">Store</label>
          <select id="storeSelect"></select>
        </div>
        <div class="field">
          <label for="cameraSelect">Camera</label>
          <select id="cameraSelect"></select>
        </div>
        <div class="field">
          <label for="blueprintFile">Upload Store Blueprint</label>
          <input id="blueprintFile" type="file" accept=".png,.jpg,.jpeg,.svg" />
        </div>
        <div class="field">
          <label for="zoneName">Zone / Shelf Name</label>
          <input id="zoneName" type="text" placeholder="e.g. Dairy Aisle" />
        </div>
        <div class="field">
          <label for="trajectoryVideoFile">Video playback sync</label>
          <input id="trajectoryVideoFile" type="file" accept=".mp4,.avi,.mov,.mkv" />
        </div>
        <div class="field">
          <label for="playbackSlider">Frame sync</label>
          <input id="playbackSlider" type="range" min="0" max="0" value="0" step="1" />
        </div>
        <video id="playbackVideo" controls playsinline style="width:100%; max-height:220px; margin-bottom:12px; background:#0f172a; border-radius:8px; display:none;"></video>
        <div class="field">
          <label>Calibration mode</label>
          <button id="calibrationBtn" type="button" class="btn-secondary">Select 4 video points + 4 blueprint points</button>
        </div>
        <div class="field">
          <button id="saveCalibrationBtn" type="button">Save Calibration</button>
        </div>
        <div class="field">
          <button id="drawZoneBtn" type="button" class="btn-secondary">Draw Zone Polygon</button>
        </div>
        <div class="field">
          <button id="saveZoneBtn" type="button">Save Zone</button>
        </div>
        <div id="statusBox" class="status"></div>
      </aside>

      <section class="panel canvas-wrap">
        <div class="stat-grid">
          <div class="stat"><strong id="statCamera">-</strong><br><small>Camera</small></div>
          <div class="stat"><strong id="statTracks">0</strong><br><small>Tracked Customers</small></div>
          <div class="stat"><strong id="statZones">0</strong><br><small>Blueprint Zones</small></div>
        </div>
        <div class="canvas-area">
          <canvas id="blueprintCanvas" width="960" height="720"></canvas>
        </div>
        <div class="legend">
          <span><i class="dot" style="background:#ef4444"></i> Video calibration points</span>
          <span><i class="dot" style="background:#3b82f6"></i> Blueprint mapped points</span>
          <span><i class="dot" style="background:#10b981"></i> Customer tracks</span>
          <span><i class="dot" style="background:#f59e0b"></i> Shelf / zone polygons</span>
        </div>
      </section>
    </div>
  </div>

  <script>
    const storeSelect = document.getElementById('storeSelect');
    const cameraSelect = document.getElementById('cameraSelect');
    const blueprintFile = document.getElementById('blueprintFile');
    const statusBox = document.getElementById('statusBox');
    const canvas = document.getElementById('blueprintCanvas');
    const ctx = canvas.getContext('2d');
    const calibrationBtn = document.getElementById('calibrationBtn');
    const saveCalibrationBtn = document.getElementById('saveCalibrationBtn');
    const drawZoneBtn = document.getElementById('drawZoneBtn');
    const saveZoneBtn = document.getElementById('saveZoneBtn');
    const zoneName = document.getElementById('zoneName');
    const trajectoryVideoFile = document.getElementById('trajectoryVideoFile');
    const playbackVideo = document.getElementById('playbackVideo');
    const playbackSlider = document.getElementById('playbackSlider');

    let currentStore = null;
    let currentCamera = null;
    let blueprintImage = null;
    let calibrationSource = [];
    let calibrationTarget = [];
    let zonePolygon = [];
    let zoneMode = false;
    let trackedCustomers = [];
    let trajectoryEvents = [];
    let currentFrame = 0;
    let defaultFps = 30;

    function setStatus(message, isError = false) {
      statusBox.textContent = message;
      statusBox.className = 'status show' + (isError ? ' error' : '');
    }

    function clearStatus() {
      statusBox.className = 'status';
      statusBox.textContent = '';
    }

    async function api(path, options = {}) {
      const token = localStorage.getItem('access_token');
      const headers = { ...(options.headers || {}) };
      if (!headers.Authorization && token) headers.Authorization = `Bearer ${token}`;
      const response = await fetch(path, { ...options, headers });
      const text = await response.text();
      let payload = null;
      try { payload = text ? JSON.parse(text) : null; } catch (error) { payload = null; }
      if (!response.ok) {
        const message = payload && payload.detail ? payload.detail : 'Request failed';
        throw new Error(message);
      }
      return payload;
    }

    async function loadStores() {
      const stores = await api('/api/production/stores?page=1&page_size=200');
      storeSelect.innerHTML = stores.map((store) => `<option value="${store.id}">${store.store_name}</option>`).join('');
      if (stores.length) {
        storeSelect.value = stores[0].id;
        await loadCameras();
      }
    }

    async function loadCameras() {
      const storeId = storeSelect.value;
      const cameras = await api(`/api/production/cameras?store_id=${storeId}&page=1&page_size=200`);
      cameraSelect.innerHTML = cameras.map((camera) => `<option value="${camera.id}">${camera.camera_name || 'Camera ' + camera.id}</option>`).join('');
      if (cameras.length) {
        cameraSelect.value = cameras[0].id;
        await loadBlueprintData();
      }
    }

    async function loadBlueprintData() {
      const storeId = storeSelect.value;
      const cameraId = cameraSelect.value;
      const data = await api(`/api/blueprint/stores/${storeId}`);
      currentStore = data;
      const camera = data.cameras.find((entry) => String(entry.id) === String(cameraId)) || data.cameras[0] || null;
      currentCamera = camera;
      if (camera && camera.blueprint_url) {
        blueprintImage = new Image();
        blueprintImage.onload = renderBlueprint;
        blueprintImage.src = camera.blueprint_url;
      } else if (data.blueprint_url) {
        blueprintImage = new Image();
        blueprintImage.onload = renderBlueprint;
        blueprintImage.src = data.blueprint_url;
      } else {
        blueprintImage = null;
        renderBlueprint();
      }
      if (currentCamera) {
        calibrationSource = currentCamera.calibration_points && currentCamera.calibration_points.source ? currentCamera.calibration_points.source : [];
        calibrationTarget = currentCamera.calibration_points && currentCamera.calibration_points.target ? currentCamera.calibration_points.target : [];
        zonePolygon = currentCamera.blueprint_polygon_zones && currentCamera.blueprint_polygon_zones.length ? currentCamera.blueprint_polygon_zones[0].points || [] : [];
      }
      await loadTrackedCustomers();
      await loadVideoTrajectory();
      renderBlueprint();
    }

    async function loadTrackedCustomers() {
      try {
        const cameraId = cameraSelect.value;
        const data = await api(`/api/blueprint/cameras/${cameraId}/tracks`);
        trackedCustomers = data.tracks || [];
      } catch (error) {
        trackedCustomers = [];
      }
    }

    async function loadVideoTrajectory() {
      try {
        if (!currentCamera || !currentCamera.video_path) {
          trajectoryEvents = [];
          renderBlueprint();
          return;
        }
        const videoId = currentCamera.video_path;
        const data = await api(`/api/blueprint/videos/trajectory?video_id=${encodeURIComponent(videoId)}`);
        trajectoryEvents = data.events || [];
        const maxFrame = trajectoryEvents.reduce((max, event) => Math.max(max, Number(event.frame_number || 0)), 0);
        playbackSlider.max = String(maxFrame || 0);
        playbackSlider.value = String(Math.min(currentFrame, maxFrame || 0));
        renderBlueprint();
      } catch (error) {
        trajectoryEvents = [];
        playbackSlider.max = '0';
        playbackSlider.value = '0';
        renderBlueprint();
      }
    }

    function renderBlueprint() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (blueprintImage) {
        const scale = Math.min(canvas.width / blueprintImage.width, canvas.height / blueprintImage.height);
        const drawWidth = blueprintImage.width * scale;
        const drawHeight = blueprintImage.height * scale;
        const x = (canvas.width - drawWidth) / 2;
        const y = (canvas.height - drawHeight) / 2;
        ctx.drawImage(blueprintImage, x, y, drawWidth, drawHeight);
      } else {
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#64748b';
        ctx.font = '20px sans-serif';
        ctx.fillText('Upload or associate a blueprint', 300, 340);
      }

      drawCalibrationPoints();
      drawBlueprintZones();
      drawTrackedCustomers();
      drawTrajectoryMarkers();
    }

    function drawCalibrationPoints() {
      calibrationSource.forEach((point) => {
        drawCircle(point.x, point.y, 6, '#ef4444');
      });
      calibrationTarget.forEach((point) => {
        drawCircle(point.x, point.y, 6, '#3b82f6');
      });
    }

    function drawBlueprintZones() {
      if (!zonePolygon || !zonePolygon.length) return;
      ctx.beginPath();
      zonePolygon.forEach((point, index) => {
        if (index === 0) ctx.moveTo(point.x, point.y); else ctx.lineTo(point.x, point.y);
      });
      ctx.closePath();
      ctx.fillStyle = 'rgba(245, 158, 11, 0.2)';
      ctx.fill();
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawTrackedCustomers() {
      trackedCustomers.forEach((track) => {
        const pathText = track.customer_path || '';
        const points = parsePath(pathText);
        if (!points.length) return;
        const last = points[points.length - 1];
        drawCircle(last.x, last.y, 5, '#10b981');
        ctx.fillStyle = '#0f172a';
        ctx.font = '12px sans-serif';
        ctx.fillText(`ID ${track.customer_id}`, last.x + 8, last.y - 8);
      });
    }

    function drawTrajectoryMarkers() {
      if (!trajectoryEvents.length) return;
      const frameEvents = trajectoryEvents.filter((event) => Number(event.frame_number) === Number(currentFrame));
      if (!frameEvents.length) return;
      frameEvents.forEach((event) => {
        const x = Number(event.blueprint_x || 0);
        const y = Number(event.blueprint_y || 0);
        drawCircle(x, y, 5, '#10b981');
        ctx.fillStyle = '#0f172a';
        ctx.font = '12px sans-serif';
        ctx.fillText(`Customer #${event.customer_id}`, x + 8, y - 8);
      });
    }

    function parsePath(pathText) {
      if (!pathText) return [];
      const pairs = pathText.split('->');
      const points = [];
      for (const pair of pairs) {
        const match = pair.match(/\(([-0-9.]+),([-0-9.]+)\)/);
        if (!match) continue;
        points.push({ x: Number(match[1]), y: Number(match[2]) });
      }
      return points;
    }

    function drawCircle(x, y, radius, color) {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }

    let selectedCalibration = null;
    let activeMode = null;

    calibrationBtn.addEventListener('click', () => {
      activeMode = 'source';
      calibrationSource = [];
      calibrationTarget = [];
      setStatus('Click four matching points on the camera image in order.');
    });

    drawZoneBtn.addEventListener('click', () => {
      activeMode = 'zone';
      zonePolygon = [];
      setStatus('Click polygon points on the blueprint to define a shelf or zone');
    });

    canvas.addEventListener('click', (event) => {
      const rect = canvas.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * canvas.width;
      const y = ((event.clientY - rect.top) / rect.height) * canvas.height;

      if (activeMode === 'source') {
        calibrationSource.push({ x, y });
        if (calibrationSource.length >= 4) {
          activeMode = 'target';
          setStatus('Now click the matching four blueprint points in the same order.');
        }
        renderBlueprint();
      } else if (activeMode === 'target') {
        calibrationTarget.push({ x, y });
        if (calibrationTarget.length >= 4) {
          activeMode = null;
          setStatus('Calibration points collected. Save to store the mapping.');
        }
        renderBlueprint();
      } else if (activeMode === 'zone') {
        zonePolygon.push({ x, y });
        renderBlueprint();
      }
    });

    saveCalibrationBtn.addEventListener('click', async () => {
      if (calibrationSource.length < 4 || calibrationTarget.length < 4) {
        setStatus('Need at least four calibration points to save.', true);
        return;
      }

      const payload = {
        calibration_points: { source: calibrationSource, target: calibrationTarget },
        homography_matrix: [[1,0,0],[0,1,0],[0,0,1]],
        blueprint_polygon_zones: [],
        blueprint_width: canvas.width,
        blueprint_height: canvas.height,
        blueprint_url: currentStore && currentStore.blueprint_url ? currentStore.blueprint_url : null,
      };

      await api(`/api/blueprint/cameras/${cameraSelect.value}/calibrate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      setStatus('Calibration saved.');
      renderBlueprint();
    });

    saveZoneBtn.addEventListener('click', async () => {
      if (!zonePolygon.length) {
        setStatus('Draw at least three points for a zone polygon.', true);
        return;
      }
      const name = zoneName.value || `Zone ${new Date().getTime()}`;
      await api(`/api/blueprint/cameras/${cameraSelect.value}/zones`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ zone_name: name, zone_code: name, points: zonePolygon })
      });
      setStatus('Zone saved to the blueprint.');
      zonePolygon = [];
      renderBlueprint();
    });

    playbackSlider.addEventListener('input', (event) => {
      currentFrame = Number(event.target.value || 0);
      if (playbackVideo && playbackVideo.currentTime && playbackVideo.duration) {
        playbackVideo.currentTime = currentFrame / Math.max(defaultFps, 1);
      }
      renderBlueprint();
    });

    playbackVideo.addEventListener('timeupdate', () => {
      if (!playbackVideo.duration || playbackVideo.duration <= 0) return;
      const nextFrame = Math.max(0, Math.round(playbackVideo.currentTime * defaultFps));
      currentFrame = nextFrame;
      playbackSlider.value = String(nextFrame);
      renderBlueprint();
    });

    trajectoryVideoFile.addEventListener('change', (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      playbackVideo.src = url;
      playbackVideo.style.display = 'block';
      playbackVideo.load();
      setStatus(`Loaded video preview: ${file.name}`);
    });

    blueprintFile.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const formData = new FormData();
      formData.append('file', file);
      const result = await api(`/api/blueprint/stores/${storeSelect.value}/upload`, {
        method: 'POST',
        body: formData,
      });
      const url = result.blueprint_url || result.url;
      if (url) {
        blueprintImage = new Image();
        blueprintImage.onload = renderBlueprint;
        blueprintImage.src = url;
      }
      setStatus('Blueprint uploaded successfully.');
    });

    storeSelect.addEventListener('change', () => loadCameras());
    cameraSelect.addEventListener('change', () => loadBlueprintData());
    loadStores();
  </script>
</body>
</html>
